# Workspace separado: usa uma cópia INSTRUMENTADA de nova-snark 0.73.0
# (vendor/nova-snark-0.73.0-prof, só cronômetros e censo de larguras) via
# [patch]. O workspace principal e os binários da campanha não são afetados.
[workspace]

[package]
name = "spf-profile"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive"] }
ff = "0.13.1"
nova-snark = "=0.73.0"
pnf-circuit = { path = "../crates/pnf-circuit" }
spf-baselines = { path = "../crates/spf-baselines" }
serde_json = "1.0.140"
libc = "0.2"

[patch.crates-io]
nova-snark = { path = "../vendor/nova-snark-0.73.0-prof" }

[profile.release]
debug = 1
overflow-checks = true
lto = "thin"
