[workspace]
resolver = "2"
members = ["crates/pnf-reference", "crates/pnf-circuit", "crates/pnf-bench", "crates/spf-baselines", "crates/dual-proof", "crates/shadow-proof", "tools/berkeley-validation"]
# Workspace próprio, com nova-snark instrumentado (log 0006).
exclude = ["profiling", "vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.98"
bincode = { version = "2", features = ["serde", "std"] }
clap = { version = "4.5.40", features = ["derive"] }
ff = "0.13.1"
nova-snark = "=0.73.0"
num-bigint = "0.4.6"
num-traits = "0.2.19"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
softfloat = "1.0.0"

[profile.release]
debug = 1
overflow-checks = true
lto = "thin"

[profile.test]
opt-level = 3
overflow-checks = true
